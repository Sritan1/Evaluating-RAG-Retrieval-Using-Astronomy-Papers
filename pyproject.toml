[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astronomy-retrieval-evaluation"
version = "0.1.0"
description = "A study of astronomy paper retrieval and citation-derived relevance labels."
requires-python = ">=3.11"
dependencies = ["requests>=2.32.5,<3", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.9,<2", "bm25s>=0.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
