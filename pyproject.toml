[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "astronomy-retrieval-evaluation"
version = "0.1.0"
description = "A study of astronomy paper retrieval and citation-derived relevance labels."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.32.5,<3", "certifi>=2026.10.19", "python-dotenv>=1.1,<2", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.9,<2", "bm25s>=0.2,<0.3"]
models = ["sentence-transformers==6.1.0", "transformers==5.19.0", "torch==2.14.1", "filelock>=4.2.1,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
